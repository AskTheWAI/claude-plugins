# Generated by scripts/sync-agent-plugins.mjs. Edit Main, not distribution repos.
name: Dispatch Main Plugin Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    if: ${{ github.repository == 'AskTheWAI/claude-plugins' && vars.PLUGIN_SYNC_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create narrow Main dispatch token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ASKTHEW_SYNC_APP_ID }}
          private-key: ${{ secrets.ASKTHEW_SYNC_APP_PRIVATE_KEY }}
          owner: AskTheWAI
          repositories: Main

      - name: Dispatch guarded sync to Main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          node -e 'const fs = require("node:fs"); const payload = { event_type: "plugin-sync", client_payload: { source_repo: process.env.SOURCE_REPO, source_sha: process.env.SOURCE_SHA, source_ref: process.env.SOURCE_REF } }; fs.writeFileSync("dispatch-payload.json", JSON.stringify(payload));'
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/AskTheWAI/Main/dispatches \
            --data @dispatch-payload.json
